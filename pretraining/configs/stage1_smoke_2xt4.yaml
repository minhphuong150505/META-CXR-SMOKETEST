# Stage-1 smoke recipe: E123 is trained once; encoder subsets are evaluated
# later as post-training inference sensitivity, never as independent ablations.
model:
  arch: blip2
  model_type: pretrain
  load_pretrained: false
  freeze_vit: true
  vit_model: biovil
  vit_model_cls: [pubmedclip]
  encoders:
    biovil: true
    pubmedclip: true
    swin: true
  swin:
    backend: hf
    model_name: "ChayanM/SwinV2-GPT2_Mimic"
    pretrained: true
    frozen: true
    normalize: true
  num_query_token: 32
  # 128 (was 256) caps the Q-Former text branch to halve its activation memory on
  # the 16GB T4; heavy multi-view + long-text batches were pushing peak VRAM toward
  # the ceiling and OOM-ing one rank mid-epoch. Not part of config_fingerprint, so
  # resume identity is unchanged.
  max_txt_len: 128
  mhcac:
    threshold_path: "threshold.json"
  multi_view: true
  view_fusion:
    num_heads: 8
    ffn_ratio: 4
    num_blocks: 1
    num_view_types: 4
    dropout: 0.1
    p_view_drop: 0.2
  loss:
    lambda_mpc: 0.0
    lambda_view_consistency: 0.0
  data:
    study_sampling: true
    anchor_priority: [PA, AP, lateral]
    max_aux_views: 1

datasets:
  mimic_cxr:
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 448
        resize_size: 512
      eval:
        name: "blip_image_eval"
        image_size: 448
        resize_size: 512
    text_processor:
      train: {name: "my_blip_caption", prompt: ""}
      eval: {name: "my_blip_caption", prompt: ""}

run:
  task: image_text_pretrain_eval
  project_name: meta-cxr
  wandb_entity: ""
  run_name: REPLACE_AT_RUNTIME
  source_commit: REPLACE_AT_RUNTIME
  dataset_manifest_sha256: REPLACE_AT_RUNTIME
  config_fingerprint: REPLACE_AT_RUNTIME

  lr_sched: linear_warmup_cosine_lr
  # Every rate divided by 4 (was 2e-4 / 2e-4 / 1e-4 / 1e-5 / 5e-5). The ratios
  # between the three parameter groups are unchanged, so lr_scale still means
  # what it did. Note this does NOT address the non-finite gradients seen in
  # run e123: no optimizer step was ever applied there, so the NaN appears at
  # the initial weights and no learning rate can influence it. The reduction is
  # headroom for after that is fixed.
  # These fields are part of the runtime contract, so a strict resume of a
  # checkpoint trained at the old rates will refuse -- intended, start fresh.
  init_lr_cls: 5.0e-5
  init_lr_q: 5.0e-5
  init_lr: 2.5e-5
  min_lr: 2.5e-6
  warmup_lr: 1.25e-5
  weight_decay: 0.02
  max_epoch: 1
  scheduler_max_epoch: 10
  save_freq: 0
  batch_size_train: 4
  # Validation runs under torch.no_grad(), so it can safely use twice the
  # training micro-batch. This halves full-objective validation time without
  # changing the optimizer trajectory, LR schedule, or checkpoint identity.
  batch_size_eval: 4
  num_workers: 4
  warmup_steps: 1
  accum_grad_iters: 16
  max_grad_norm: 1.0
  # Kept true as a safe belt-and-suspenders alongside the zero-weighted param
  # touch in blip2_qformer.forward(). The former data-dependent hazard --
  # view_fusion being skipped on a micro-batch with no auxiliary view -- is fixed
  # in Blip2Qformer._fuse (it now always runs the module on a zero auxiliary, so
  # every rank uses the same parameter set in the same grad-ready order). This
  # flag only adds a per-step graph traversal now; it is not what prevents the
  # deadlock.
  find_unused_parameters: true

  max_len: 256
  min_len: 8
  num_beams: 1
  seed: 42
  output_dir: /kaggle/working/meta-cxr-output
  # fp32. T4 is Turing (sm_75) and has no bf16 tensor core, so bf16 -- the usual
  # answer to fp16 range problems -- is not available here; fp32 has the same
  # exponent range and is the stand-in. GradScaler only scales the loss and the
  # gradients, never the forward activations, so an fp16 activation overflow
  # produces non-finite gradients at *every* loss scale. That is exactly what
  # run e123 showed (overflow at scale 0.5 as readily as at 16384), and it is
  # the one hypothesis the scaler cannot rule out. Running fp32 settles it: if
  # the gradients are finite, the cause was fp16 range; if they are still
  # non-finite, the cause is structural and summarize_nonfinite_grads names it.
  # Costs roughly 2x step time and more activation memory, which is why
  # BATCH_PER_GPU/ACCUMULATION move to 2/32 in nb01 (effective batch unchanged).
  amp: false

  # strict  -> a resume must restore model + optimizer + scheduler + scaler +
  #            per-rank RNG + step counters, and the config/runtime contract must
  #            match, or the run aborts. This is the mode that makes a resumed
  #            run equivalent to an uninterrupted one.
  # best_effort -> restore what is available, reset what is not, and label the
  #            result PARTIAL RESUME in the log.
  resume_mode: strict
  # Kernel-level determinism. Off in production (cudnn.benchmark is a real
  # throughput win on the frozen conv encoders); the integration test turns it
  # on. Requires CUBLAS_WORKSPACE_CONFIG=:4096:8 in the environment.
  deterministic: false

  uncertain_policy: ignore_uncertain
  # Total validation loss (ITC+ITM+LM+cls+distill+...), i.e. the same objective
  # training minimises -- this is what the pre-smoke setup selected on, via the
  # old runner's `selection_metric` default of "loss".
  # It requires the full eval forward: classification_only_eval calls
  # forward_image, which returns logits only and no loss at all. The full
  # forward runs collectives (ITC all_gather, ITM/teacher all_reduce), which is
  # why DistributedEvalSampler pads every rank to the same batch count.
  # `loss_cls` stays available in the stats if a classification-only selector is
  # wanted later.
  selection_metric: loss
  selection_mode: min
  classification_only_eval: false
  save_predictions: false
  finalize_test: false
  evaluate: false
  train_splits: [train]
  valid_splits: [val]
  test_splits: [test]

  device: cuda
  world_size: 2
  dist_url: env://
  distributed: true
  use_dist_eval_sampler: true
