# Stage-1 smoke recipe: E123 is trained once; encoder subsets are evaluated
# later as post-training inference sensitivity, never as independent ablations.
model:
  arch: blip2
  model_type: pretrain
  load_pretrained: false
  freeze_vit: true
  vit_model: biovil
  vit_model_cls: [pubmedclip]
  encoders:
    biovil: true
    pubmedclip: true
    swin: true
  swin:
    backend: hf
    model_name: "ChayanM/SwinV2-GPT2_Mimic"
    pretrained: true
    frozen: true
    normalize: true
  num_query_token: 32
  max_txt_len: 256
  mhcac:
    threshold_path: "threshold.json"
  multi_view: true
  view_fusion:
    num_heads: 8
    ffn_ratio: 4
    num_blocks: 1
    num_view_types: 4
    dropout: 0.1
    p_view_drop: 0.2
  loss:
    lambda_mpc: 0.0
    lambda_view_consistency: 0.0
  data:
    study_sampling: true
    anchor_priority: [PA, AP, lateral]
    max_aux_views: 1

datasets:
  mimic_cxr:
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 448
        resize_size: 512
      eval:
        name: "blip_image_eval"
        image_size: 448
        resize_size: 512
    text_processor:
      train: {name: "my_blip_caption", prompt: ""}
      eval: {name: "my_blip_caption", prompt: ""}

run:
  task: image_text_pretrain_eval
  project_name: meta-cxr
  wandb_entity: ""
  run_name: REPLACE_AT_RUNTIME
  source_commit: REPLACE_AT_RUNTIME
  dataset_manifest_sha256: REPLACE_AT_RUNTIME
  config_fingerprint: REPLACE_AT_RUNTIME

  lr_sched: linear_warmup_cosine_lr
  init_lr_cls: 2.0e-4
  init_lr_q: 2.0e-4
  init_lr: 1.0e-4
  min_lr: 1.0e-5
  warmup_lr: 5.0e-5
  weight_decay: 0.02
  max_epoch: 1
  scheduler_max_epoch: 10
  save_freq: 0
  batch_size_train: 4
  batch_size_eval: 2
  num_workers: 4
  warmup_steps: 1
  accum_grad_iters: 16
  max_grad_norm: 1.0
  # Required: view_fusion is skipped for studies with no auxiliary view, and the
  # lambda_mpc=0 / lambda_view_consistency=0 terms leave their params without
  # gradients, so which parameters are used varies per sample and per rank. DDP
  # rejects that unless unused-parameter detection is on.
  find_unused_parameters: true

  max_len: 256
  min_len: 8
  num_beams: 1
  seed: 42
  output_dir: /kaggle/working/meta-cxr-output
  amp: true

  uncertain_policy: ignore_uncertain
  selection_metric: f1_positive_macro_defined_only
  selection_mode: max
  classification_only_eval: true
  save_predictions: false
  finalize_test: false
  evaluate: false
  train_splits: [train]
  valid_splits: [val]
  test_splits: [test]

  device: cuda
  world_size: 2
  dist_url: env://
  distributed: true
  use_dist_eval_sampler: true
